name: Flutter Tests

# push を main / develop（とタグ）に絞っている。
# ブランチを絞らないと、PR ブランチへの push で push と pull_request の
# 両方が発火し、同じコミットに対してテストが二重に走るため。
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:

# 同じ PR に連続で push した場合、古い実行を打ち切る。
# main / develop への push は各コミットの結果を残したいので打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 版は flutter_app/pubspec.yaml の environment.flutter を読む。
      # `channel: stable` だけだと、新しい Dart を持つ stable が出た日に
      # pubspec.lock が固定している analyzer と食い違い、build_runner が例外を
      # 投げたまま終了せずジョブが終わらなくなる（#198）。
      #
      # ワークフローに直接書かないのは、5箇所に散って片方だけ古くなるのを
      # 避けるため。**flutter-version との併用はエラーになる。**
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter_app/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: flutter_app

      - name: Run unit & widget tests
        run: flutter test
        working-directory: flutter_app

      # GAS 側の期別判定はアプリ側 SeasonType と同一でなければならない
      # （v=1 と v=2 で結果が食い違うため）。片方だけ変更されるのを防ぐ。
      - name: Check GAS season logic
        run: node scripts/check_gas_season.js
