name: Flutter Tests

# push を main / develop（とタグ）に絞っている。
# ブランチを絞らないと、PR ブランチへの push で push と pull_request の
# 両方が発火し、同じコミットに対してテストが二重に走るため。
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:

# 同じ PR に連続で push した場合、古い実行を打ち切る。
# main / develop への push は各コミットの結果を残したいので打ち切らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # 通常2分。#198 では build_runner が例外を投げたまま居座り、上限が無い
    # せいで3時間走り続けた。生成器側の挙動なので固定を外せば再発しうる
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 版は flutter_app/pubspec.yaml の environment.flutter を読む。
      # ここに直接書かない理由と固定した経緯は #198。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter_app/pubspec.yaml
          cache: true

      # build_runner より前に置く。後ろだと生成物（*.g.dart / *.freezed.dart）まで
      # 検査対象に入り、生成器の版が変わっただけで落ちうる。手で書いたコードだけを見る。
      # 依存パッケージも要らないので、pub get の前で最も早く落ちる。
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: flutter_app

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: flutter_app

      - name: Run unit & widget tests
        run: flutter test
        working-directory: flutter_app

      # GAS 側の期別判定はアプリ側 SeasonType と同一でなければならない
      # （v=1 と v=2 で結果が食い違うため）。片方だけ変更されるのを防ぐ。
      - name: Check GAS season logic
        run: node scripts/check_gas_season.js

      # 旧アプリはストア更新をしない限り永久に残るため、`stops` を指定しない
      # 従来のリクエスト（v=1/2/3）の応答は1バイトも変えてはいけない。
      - name: Check GAS response snapshots
        run: node scripts/check_gas_response.js
