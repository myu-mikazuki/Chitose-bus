name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 版は flutter_app/pubspec.yaml の environment.flutter を読む。
      # ここに直接書かない理由と固定した経緯は #198。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter_app/pubspec.yaml
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Create .dart_define
        if: vars.DART_DEFINE_CONTENTS != ''
        env:
          DART_DEFINE_CONTENTS: ${{ vars.DART_DEFINE_CONTENTS }}
        run: echo "$DART_DEFINE_CONTENTS" > .dart_defines

      - name: Restore Pods cache
        uses: actions/cache@v4
        with:
          path: |
            flutter_app/ios/Pods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('flutter_app/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get
        working-directory: flutter_app

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: flutter_app

      - name: Install certificate and provisioning profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Build IPA (release, signed)
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
        run: |
          cat > ios/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.myu-mikazuki.kagibus</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          PLIST

          if [ -n "$ADMOB_IOS_APP_ID" ]; then
            sed -i '' "s|ADMOB_APP_ID = .*|ADMOB_APP_ID = $ADMOB_IOS_APP_ID|" ios/Flutter/Release.xcconfig
          fi

          DART_DEFINE_ARGS="--dart-define=USE_TEST_ADS=false"
          if [ -f "$GITHUB_WORKSPACE/.dart_defines" ]; then
            DART_DEFINE_ARGS="$DART_DEFINE_ARGS $(python3 -c "import json; d=json.load(open('$GITHUB_WORKSPACE/.dart_defines')); print(' '.join(f'--dart-define={k}={v}' for k, v in d.items()))")"
          fi

          flutter build ios --release --no-codesign $DART_DEFINE_ARGS

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/Runner.xcarchive" \
            "PROFILE_SPECIFIER=$PROFILE_UUID" \
            "DEVELOPMENT_TEAM=$TEAM_ID"

          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa"

          IPA_PATH=$(find "$GITHUB_WORKSPACE/build/ios/ipa" -name "*.ipa" | head -1)
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV
        working-directory: flutter_app

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

      - name: Rename IPA
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          mv "$IPA" "kagi_bus-${{ github.ref_name }}-ios.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: kagi_bus-${{ github.ref_name }}-ios.ipa
          if-no-files-found: error

      - name: Cleanup signing
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 版は flutter_app/pubspec.yaml の environment.flutter を読む。
      # ここに直接書かない理由と固定した経緯は #198。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter_app/pubspec.yaml
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Create .dart_define
        if: vars.DART_DEFINE_CONTENTS != ''
        env:
          DART_DEFINE_CONTENTS: ${{ vars.DART_DEFINE_CONTENTS }}
        run: echo "$DART_DEFINE_CONTENTS" > .dart_defines

      - name: Flutter pub get
        run: flutter pub get
        working-directory: flutter_app

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: flutter_app

      - name: Set DART_DEFINE_ARGS
        run: |
          DART_DEFINE_ARGS="--dart-define=USE_TEST_ADS=false"
          if [ -f "$GITHUB_WORKSPACE/.dart_defines" ]; then
            DART_DEFINE_ARGS="$DART_DEFINE_ARGS $(python3 -c "import json; d=json.load(open('$GITHUB_WORKSPACE/.dart_defines')); print(' '.join(f'--dart-define={k}={v}' for k, v in d.items()))")"
          fi
          echo "DART_DEFINE_ARGS=$DART_DEFINE_ARGS" >> $GITHUB_ENV

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p flutter_app/android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > flutter_app/android/app/keystore/kagi_bus.jks

      - name: Build APK (release)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/keystore/kagi_bus.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: flutter build apk --release $DART_DEFINE_ARGS
        working-directory: flutter_app

      - name: Build AAB (release)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/keystore/kagi_bus.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: flutter build appbundle --release $DART_DEFINE_ARGS
        working-directory: flutter_app

      - name: Cleanup keystore
        if: always()
        run: rm -f flutter_app/android/app/keystore/kagi_bus.jks

      - name: Rename APK
        run: mv flutter_app/build/app/outputs/flutter-apk/app-release.apk kagi_bus-${{ github.ref_name }}-android.apk

      - name: Rename AAB
        run: mv flutter_app/build/app/outputs/bundle/release/app-release.aab kagi_bus-${{ github.ref_name }}-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: kagi_bus-${{ github.ref_name }}-android.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: kagi_bus-${{ github.ref_name }}-android.aab
          if-no-files-found: error

      # Google Play へのアップロード（Issue #165）
      #
      # tracks: internal に上げるだけで、製品版への昇格は Play Console から手動で行う。
      # 誤って本番公開されるのを防ぐため。運用が安定してから track を上げるか検討する。
      #
      # サービスアカウントの GCP プロジェクトで Google Play Android Developer API
      # を有効にしておく必要がある。無効だと最初のアップロードが失敗する。
      #
      # secrets は if: で直接参照できないため、出力に落としてから判定する。
      # 未設定の環境ではスキップし、リリースビルド自体は通るようにしている
      # （fork や、サービスアカウントを用意していない状態でも壊れないため）。
      - name: Check Play credentials
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON が未設定のため Google Play へのアップロードをスキップします"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play (internal)
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.myu_mikazuki.kagibus
          releaseFiles: kagi_bus-${{ github.ref_name }}-android.aab
          # track は非推奨で、将来の版で削除される（#214）
          tracks: internal
          status: completed
          # distribution/whatsnew/whatsnew-<言語> がストアの「新機能」になる
          whatsNewDirectory: distribution/whatsnew

  release:
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    # 他のジョブと揃えて上限を入れる（#198）
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # リリースノート（doc/release-notes/<タグ>.md）を読むために checkout する
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: artifacts/

      # リリースノートはリリースブランチの作業で doc/release-notes/<タグ>.md に用意する。
      # 無い場合もリリース自体は失敗させず、自動生成ノートのみで公開する。
      - name: Resolve release notes
        id: notes
        run: |
          NOTES="doc/release-notes/${{ github.ref_name }}.md"
          if [ -f "$NOTES" ]; then
            echo "リリースノートを使用します: $NOTES"
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$NOTES が見つからないため、自動生成ノートのみで公開します"
            : > generated-only.md
            echo "path=generated-only.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # body_path の内容の後ろに、GitHub が生成する PR 一覧が追記される
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*
